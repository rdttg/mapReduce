<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Distributed Task Manager</title><link rel="stylesheet" href="/static/style.css"></head><body><main><header><small>SISTEMAS DISTRIBUÍDOS / 2026</small><h1>Distributed Task Manager</h1><p>Mini MapReduce · Bully · Lamport · Heartbeat</p></header><section id="summary" class="stats"></section><h2>Topologia do cluster</h2><section id="nodes" class="nodes"></section><section class="panel"><h2>Novo trabalho</h2><form id="form"><textarea id="text" required placeholder="Insira o texto para contagem de palavras"></textarea><div class="controls"><label>Fragmentos <input id="fragments" type="number" min="1" max="100" value="6"></label><label>Atraso por tarefa (s) <input id="delay" type="number" min="0" max="60" value="8"></label><button type="button" id="example">Texto de exemplo</button><button type="submit" class="primary">Processar texto</button></div><p id="notice" role="status"></p></form></section><h2>Trabalhos e resultados</h2><section id="jobs"></section><section class="panel"><h2>Eventos distribuídos</h2><div id="events"></div></section></main><script src="/static/app.js"></script></body></html>
